services:
  - type: web
    name: blackjack-academico
    runtime: python
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn --worker-class gthread -w 1 --threads 4 --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blackjack-db
          property: connectionString
      - key: MIN_PLAYERS
        value: "3"
      - key: MAX_PLAYERS
        value: "5"
      - key: DECKS_COUNT
        value: "1"
      - key: FLASK_DEBUG
        value: "False"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "admin1234"

databases:
  - name: blackjack-db
    databaseName: blackjack
    user: blackjack_user
    plan: free
