services:
  - type: web
    name: blackjack-academico
    runtime: python
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blackjack-db
          property: connectionString
      - key: MIN_PLAYERS
        value: "3"
      - key: MAX_PLAYERS
        value: "5"
      - key: DECKS_COUNT
        value: "1"
      - key: SOCKETIO_ASYNC_MODE
        value: "gevent"
      - key: FLASK_DEBUG
        value: "False"

databases:
  - name: blackjack-db
    databaseName: blackjack
    user: blackjack_user
    plan: free
